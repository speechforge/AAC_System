name: Deploy AAC recorded demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['deploy/free-demo/dist/**', '.github/workflows/aac-demo.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/free-demo/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
