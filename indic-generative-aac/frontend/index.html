  <style>
    /* Design Tokens */
    :root {
      --aac-card-radius: 16px;
    }

    /* Spring Button Physics */
    .spring-press {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), 
                  box-shadow 0.15s ease, 
                  background-color 0.15s ease,
                  border-color 0.15s ease;
      touch-action: manipulation;
      user-select: none;
    }
    .spring-press:hover {
      transform: translateY(-2px);
    }
    .spring-press:active {
      transform: scale(0.95);
    }

    /* Modern Card Elevate */
    .comm-card {
      position: relative;
      overflow: hidden;
      transition: all 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .comm-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.08);
    }
    .comm-card:active {
      transform: scale(0.94);
    }

    /* Subtle Category Indicator Bar on Card Left */
    .card-accent-amber { border-top: 3px solid #f59e0b; }
    .card-accent-emerald { border-top: 3px solid #10b981; }
    .card-accent-sky { border-top: 3px solid #0284c7; }
    .card-accent-purple { border-top: 3px solid #a855f7; }
    .card-accent-yellow { border-top: 3px solid #eab308; }
    .card-accent-indigo { border-top: 3px solid #6366f1; }
    .card-accent-rose { border-top: 3px solid #f43f5e; }
    .card-accent-teal { border-top: 3px solid #14b8a6; }
    .card-accent-red { border-top: 3px solid #ef4444; }
    .card-accent-pink { border-top: 3px solid #ec4899; }

    /* Custom Minimal Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.6);
    }

    /* Soundwave Visualizer Bar */
    @keyframes soundWaveAnim {
      0%, 100% { height: 4px; }
      50% { height: 18px; }
    }
    .sound-bar {
      width: 3px;
      background-color: currentColor;
      border-radius: 99px;
      animation: soundWaveAnim 0.9s ease-in-out infinite;
    }
    .sound-bar:nth-child(2) { animation-delay: 0.15s; }
    .sound-bar:nth-child(3) { animation-delay: 0.3s; }
    .sound-bar:nth-child(4) { animation-delay: 0.45s; }

    /* Glass Blur effect */
    .glass-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .dark .glass-nav {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* High Contrast Mode */
    .high-contrast .comm-card,
    .high-contrast button {
      border-width: 2px !important;
      border-color: #000000 !important;
      box-shadow: none !important;
    }
    .dark.high-contrast .comm-card,
    .dark.high-contrast button {
      border-color: #ffffff !important;
    }

    /* ─── Feature: Accessibility Dock (text scale + grayscale) ─── */
    html {
      font-size: var(--a11y-text-scale, 100%);
      transition: font-size 0.18s ease;
    }
    html.a11y-grayscale {
      filter: grayscale(1);
    }

    /* ─── Feature: Premium Tactile Button Animations (ripple) ─── */
    .tap-ripple {
      position: relative;
      isolation: isolate;
    }
    .tap-ripple::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle, currentColor 10%, transparent 10.5%);
      background-repeat: no-repeat;
      background-position: 50%;
      background-size: 3000% 3000%;
      opacity: 0;
      pointer-events: none;
      transition: background-size 0s, opacity 0.5s ease;
    }
    .tap-ripple:active::after {
      background-size: 0% 0%;
      opacity: 0.12;
      transition: background-size 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.1s ease;
    }

    /* Button press depth + glow, layered on top of spring-press */
    .spring-press, .comm-card, button {
      will-change: transform;
    }
    .spring-press:active, .comm-card:active {
      filter: brightness(0.97);
    }

    /* Bookmark star pop animation */
    @keyframes starPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.5) rotate(-8deg); }
      70% { transform: scale(0.9) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .star-pop {
      animation: starPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Floating Accessibility Dock */
    .a11y-dock {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 60;
    }
    .a11y-dock-panel {
      transform-origin: bottom right;
      animation: dockPop 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes dockPop {
      0% { opacity: 0; transform: scale(0.9) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Voice clone dropzone */
    .voice-dropzone {
      border: 2px dashed rgba(100, 116, 139, 0.35);
      transition: all 0.15s ease;
    }
    .voice-dropzone.drag-active {
      border-color: #0c8fe6;
      background-color: rgba(12, 143, 230, 0.06);
    }

    /* Generic fade-in utility used across new panels */
    .animate-fade-in { animation: genericFadeIn 0.18s ease; }
    @keyframes genericFadeIn {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>

      return found || {k:id,e:emoji};
    }

    // JavaScript port of backend/aac_lexicon.py analyze_selection.  Concept IDs are the board's own `k` values; typed,
    // predicted and "My Words" entries have no ID and are matched only as WHOLE tokens (so "Nose" is not a negation).
    const CONCEPT_CAT = {};
    const LABEL_INDEX = {};
    Object.keys(SYMBOL_DATABASE).forEach(cat => (SYMBOL_DATABASE[cat] || []).forEach(it => {
      CONCEPT_CAT[it.k] = cat;
      ['en', 'hi', 'gu', 'mr'].forEach(lg => {
        const lab = (it.labels[lg] || '').toLowerCase().replace(/[.,!?;:।"'()]/g, '').trim();
        if (lab) { (LABEL_INDEX[lab] = LABEL_INDEX[lab] || []).push({ k: it.k, lg }); }
      });
    }));
    const FEELING_IDS = ['HAPPY', 'SAD', 'ANGRY', 'TIRED', 'SICK', 'SCARED', 'LOVE', 'EXCITED', 'PAIN'];
    const NEGATOR_TOKENS = ['no', 'not', 'नहीं', 'नही', 'ना', 'ના', 'नाही', 'नको'];
    const GREETING_IDS = ['NAMASTE', 'THANKS', 'BYE'];
    const normLabel = (x) => (x || '').toLowerCase().replace(/[.,!?;:।"'()]/g, '').replace(/\s+/g, ' ').trim();
    function resolveTypedLabel(label, lang) {
      const hits = LABEL_INDEX[normLabel(label)];
      if (!hits || !hits.length) return null;
      const own = hits.filter(h => h.lg === lang);
      const cands = (own.length ? own : hits).map(h => h.k).filter((v, i, a) => a.indexOf(v) === i);
      if (cands.length === 1) return cands[0];
      const objs = cands.filter(c => CONCEPT_CAT[c] === 'food'); const acts = cands.filter(c => CONCEPT_CAT[c] === 'actions');
      return objs.length ? objs[0] : cands[0];
    }
    function analyzeSelection(items, lang, forcedAct) {
      let negN = 0, more = false, explicitWant = false; const content = []; const kept = [];
      const resolved = items.map(it => it.cid || resolveTypedLabel(it.label, lang) || null);
      resolved.forEach((cid, i) => {
        const label = items[i].label;
        if (!cid && NEGATOR_TOKENS.indexOf(normLabel(label)) >= 0) { cid = 'NO'; }
        if (cid === 'NO') { negN += 1; return; }
        if (cid === 'WANT') { explicitWant = true; return; }
        if (cid === 'PLEASE' || cid === 'YES' || cid === 'ME') return;
        kept.push({ cid: cid || null, label: label });
        if (cid === 'MORE') { more = true; return; }
        content.push({ cid: cid, label: label, cat: cid ? CONCEPT_CAT[cid] : 'custom', more: false });
      });
      if (more) { const f = content.find(c => c.cat === 'food' || c.cid === 'MEDICINE'); if (f) f.more = true; }
      const negation = negN % 2 === 1; let amb = negN > 1;
      const isF = (c) => FEELING_IDS.indexOf(c.cid) >= 0 || ((forcedAct === 'FEELING' || forcedAct === 'FEELING_REQUEST') && (c.cid === 'GOOD' || c.cid === 'BAD'));
      let feel = content.filter(isF);
      let objs = content.filter(c => c.cat === 'food' || c.cid === 'MEDICINE');
      const acts = content.filter(c => c.cat === 'actions');
      let ppl = content.filter(c => c.cat === 'people');
      const help_ = content.filter(c => c.cid === 'HELP' || c.cid === 'HELP_EMERGENCY');
      let custom = content.filter(c => !c.cid);
      if (explicitWant && !feel.length && !acts.length && !help_.length && !objs.length && (ppl.length || custom.length)) { objs = ppl.concat(custom); ppl = []; custom = []; }
      const known = feel.concat(objs, acts, ppl, help_, custom);
      const other = content.filter(c => known.indexOf(c) < 0);
      let act = 'UNKNOWN', frame = null;
      if (amb || !content.length) { amb = true; }
      else if (other.length) {
        amb = content.length === 1;
        if (content.length === 1 && GREETING_IDS.indexOf(content[0].cid) >= 0) { act = 'GREETING'; amb = false; }
        else if (content.length === 2 && content.some(c => GREETING_IDS.indexOf(c.cid) >= 0)) { act = 'GREETING'; }
        else if (acts.some(c => c.cid === 'GO')) { act = 'REQUEST'; }
      }
      else if (feel.length) {
        if (feel.length > 1) { act = 'UNKNOWN'; amb = true; }
        else if (content.length === 1) { act = 'FEELING'; frame = 'feeling'; }
        else if (negation) { act = 'UNKNOWN'; amb = true; }
        else { act = 'FEELING_REQUEST'; frame = 'feeling_request'; }
      }
      else if (help_.length) { act = 'REQUEST'; frame = 'help'; }
      else if (acts.length) { act = 'REQUEST'; frame = 'action'; }
      else if (objs.length) { act = 'REQUEST'; frame = 'object'; }
      else { amb = true; }
      if (forcedAct) { act = forcedAct; amb = false; }
      return { act: act, negation: negation, ambiguous: amb || act === 'UNKNOWN', frame: frame, content: content, kept: kept };

    function StudioDialog({title, subtitle, closeLabel, onClose, children}) {
      const ref = useRef(null);
      useEffect(() => {
        const previous = document.activeElement;
        ref.current?.querySelector('button, input')?.focus();
        const key = event => {
          if (event.key === 'Escape') { onClose(); return; }
          if (event.key !== 'Tab') return;
          const nodes = [...ref.current.querySelectorAll('button:not([disabled]), input')];
          if (!nodes.length) return;
          const first = nodes[0], last = nodes[nodes.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        };
        document.addEventListener('keydown', key);
        return () => { document.removeEventListener('keydown', key); previous?.focus?.(); };
      }, []);
      return <div className="studio-scrim" onPointerDown={event => { if (event.target === event.currentTarget) onClose(); }}>
        <div className="studio-dialog" role="dialog" aria-modal="true" aria-label={title} ref={ref}>
          <div className="studio-dialog-head"><div><h2>{title}</h2><p>{subtitle}</p></div><button type="button" className="studio-close" aria-label={closeLabel} onClick={onClose}>✕</button></div>
          {children}
        </div>
      </div>;
    }

      const contextWords = [...tokens.map(t=>t.label), ...(inputText.trim() ? [inputText.trim()] : [])];
      const liveIntent = analyzeSelection([...tokens, ...(inputText.trim() ? [{label:inputText.trim()}] : [])], language, userAct==='auto'?null:userAct);
      useEffect(()=>{generationEpoch.current++;setIsGenerating(false);setGeneratedResult(null);setLastAudioB64(null);},[tokens,inputText,userAct]);

      const historyGroups=window.AACHistory.groups(recentConversations);

      const exportHistory=()=>{
        const blob=new Blob([window.AACHistory.csv(recentConversations)],{type:'text/csv;charset=utf-8;'});
        const url=URL.createObjectURL(blob),link=document.createElement('a');
        link.href=url;link.download='indic-aac-history-'+language+'-'+window.AACHistory.dateKey(new Date())+'.csv';
        document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
      };

      useEffect(()=>{const changed=event=>{setConnectionPrefs(event.detail);stopAllSpeech();generationEpoch.current++;setIsGenerating(false);window.AACOffline.stats(personalRef.current?.profile_id).then(setOfflineStats).catch(()=>{});};window.addEventListener('aac-connection-change',changed);window.AACOffline.stats(personalRef.current?.profile_id).then(setOfflineStats).catch(()=>{});return()=>window.removeEventListener('aac-connection-change',changed)},[stopAllSpeech]);
      const installOffline=async()=>{if(offlineInstalling)return;setOfflineInstalling(true);try{const stats=await window.AACOffline.install(personalRef.current?.profile_id,(done,total)=>setOfflineStatus(done+' / '+total));setOfflineStats(stats);setOfflineStatus(ui('Offline phrases are ready.',language));}catch(error){setOfflineStatus(error.message)}finally{setOfflineInstalling(false)}};

      const automaticSentence = useMemo(()=>{
        if(!checkedTemplates||!tokens.length||inputText.trim())return null;
        const a=analyzeSelection(tokens,language,userAct==='auto'?null:userAct);
        if(a.ambiguous)return null;
        const key=JSON.stringify([language,a.act,a.negation,a.content.map(item=>(item.more?'MORE:':'')+item.cid)]);
        return checkedTemplates[key]||null;
      },[checkedTemplates,tokens,inputText,language,userAct]);
      const intendedSentence = generatedResult?.text && (generatedResult.validated===true||generatedResult.quick_express) ? generatedResult.text : automaticSentence?.text || '';

      const accountUser=authUser || (window.AAC_OFFLINE_DEMO && personalSession ? {name:ui('Personal account',language)} : null);
      return (
        <div className="aac-app reference-communicator flex flex-col min-h-screen" data-button-theme={buttonTheme} data-symbol-style={visualStyle} data-high-contrast={highContrast} style={themeVariables(buttonTheme, darkMode, highContrast)}>
        
          <a className="skip-link" href="#communication-board">{ui("Skip to communication board",language)}</a>
          {/* Toast Notification */}
          {toast && (
            <div className={`toast-notice fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-xl shadow-lg font-semibold text-xs text-white flex items-center gap-2 animate-bounce-short ${
              toast.type === 'warning' ? 'bg-amber-600' : 'bg-brand-600'
            }`}>
              <span>{toast.type === 'warning' ? '⚠️' : 'ℹ️'}</span>
              <span>{toast.message}</span>
            </div>
          )}

          {/* ─── 1. MODERN APP HEADER (Linear / Stripe Grade) ─────────── */}
          <header className="sticky top-0 z-40 glass-nav border-b border-slate-200/80 dark:border-slate-800/80 transition-colors">
            <div className="app-header-inner">
            
              {/* App Brand */}
              <div className="app-brand" translate="no" lang="en">
                <div className="app-logo" role="img" aria-label="Indic AAC Studio logo">
                  <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 7h14a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H13l-6 4V11a4 4 0 0 1 4-4Z" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/><path d="M12 13h8m-8 5h5" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
                </div>
                <div className="flex flex-col">
                  <span className="app-brand-name">Indic AAC Studio</span>
                </div>
                <LiveClock language={language} />
              </div>

                {/* Language Switcher */}
                <select
                  aria-label={ui("Language", language)}
                  value={language}
                  onChange={(e) => setLanguage(e.target.value)}
                  className="language-select bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-bold text-xs px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 focus:outline-none cursor-pointer transition-all shadow-xs"
                >
                  <option value="en">🇬🇧 English</option>
                  <option value="hi">🇮🇳 हिन्दी</option>
                  <option value="gu">🇮🇳 ગુજરાતી</option>
                  <option value="mr">🇮🇳 मराठी</option>
                </select>

              {/* Utility Controls */}
              <div className="header-controls">
                <details className="connection-menu" onKeyDown={event=>{if(event.key==='Escape'){event.currentTarget.open=false;event.currentTarget.querySelector('summary').focus();event.stopPropagation()}}}><summary>{ui(connectionPrefs.mode==='offline'?'Offline':'Online',language)} <span aria-hidden="true">⌄</span></summary><div className="connection-menu-panel" role="group" aria-label={ui('Communication mode',language)}>
                  <div className="connection-mode-buttons">{['online','offline'].map(mode=><button type="button" key={mode} aria-pressed={connectionPrefs.mode===mode} onClick={()=>window.AACOffline.configure({mode})}>{ui(mode==='online'?'Online':'Offline',language)}</button>)}</div>
                  <p>{ui(connectionPrefs.mode==='online'?'New sentences and speech use the online GPU. Spoken audio is saved on this device.':'Offline uses checked templates and saved audio. New speech needs Online mode.',language)}</p>
                  <button type="button" disabled={offlineInstalling||connectionPrefs.mode==='offline'} onClick={installOffline}>{ui('Set up offline phrases',language)}</button>
                  <p>{offlineStats.pairs} {ui('saved audio pairs',language)} · {(offlineStats.bytes/1048576).toFixed(1)} MB</p>
                  <label><input type="checkbox" checked={connectionPrefs.saveSpeech} onChange={e=>window.AACOffline.configure({saveSpeech:e.target.checked})}/>{ui('Save online speech on this device',language)}</label>
                  <label><input type="checkbox" checked={connectionPrefs.history} onChange={e=>window.AACOffline.configure({history:e.target.checked})}/>{ui('Capture spoken-message history',language)}</label>
                  <label><input type="checkbox" checked={connectionPrefs.vibration} onChange={e=>window.AACOffline.configure({vibration:e.target.checked})}/>{ui('Vibration',language)}</label>
                  <label><input type="checkbox" checked={autoSpeakOnSelect} onChange={e=>setAutoSpeakOnSelect(e.target.checked)}/>{ui('Pronounce selected words',language)}</label>
                  <label>{ui('Saved layout',language)}<select value={visualStyle==='text'?'text':cardSize==='large'?'large':'standard'} onChange={e=>{if(e.target.value==='text')setVisualStyle('text');else{setCardSize(e.target.value);if(visualStyle==='text')setVisualStyle('emoji')}}}><option value="standard">{ui('Existing board',language)}</option><option value="large">{ui('Large touch',language)}</option><option value="text">{ui('Text first',language)}</option></select></label>
                  <SupportHub language={language} onSpeak={supportSpeak}/>
                  <p role="status">{offlineStatus}</p><button type="button" onClick={e=>{const details=e.currentTarget.closest('details');details.open=false;details.querySelector('summary').focus()}}>{ui('Close',language)}</button>
                </div></details>


                {/* My Words — pinned top-bar shortcut */}
                <button
                  onClick={() => {
                    setShowMyWords(true);setShowSettingsDrawer(false);setShowProfileSettings(false);setShowVoicePanel(false);setShowA11yDock(false);
                  }}
                  className={`tap-ripple spring-press flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-extrabold border shadow-sm ${
                    showMyWords
                      ? 'bg-pink-600 text-white border-pink-700'
                      : 'bg-gradient-to-r from-pink-50 to-amber-50 text-pink-700 border-pink-200 dark:from-pink-950/40 dark:to-amber-950/30 dark:text-pink-300 dark:border-pink-800'
                  }`}
                  aria-expanded={showMyWords} aria-controls="mywords-panel" aria-label={MY_WORDS_META.label[language]} title={ui("Open My Words — your personal grid", language)}
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true"><path d="m8 3 8 0-1 7 4 4H5l4-4-1-7Zm4 11v7" strokeLinejoin="round" strokeLinecap="round"/></svg>
                  <span className="sr-only">{MY_WORDS_META.label[language] || 'My Words'}</span>
                  {customWords.length > 0 && <span className="text-[10px] opacity-80">({customWords.length})</span>}
                </button>


                {/* Voice Pronunciation Toggle */}
                <button
                  aria-pressed={autoSpeakOnSelect}
                  aria-label={ui("Speak words on selection", language)}
                  onClick={() => setAutoSpeakOnSelect(!autoSpeakOnSelect)}
                  className={`tap-ripple spring-press p-2 rounded-lg border text-xs font-semibold transition-all ${
                    autoSpeakOnSelect
                      ? 'bg-emerald-50 border-emerald-200 text-emerald-700 dark:bg-emerald-950/60 dark:border-emerald-800 dark:text-emerald-300'
                      : 'bg-white border-slate-200 text-slate-400 dark:bg-slate-900 dark:border-slate-800'
                  }`}
                  title={autoSpeakOnSelect ? ui("Voice on click active", language) : ui("Voice on click muted", language)}
                >
                  {autoSpeakOnSelect ? <Icons.Volume /> : <Icons.Mute />}
                </button>


                <button onClick={() => {setSettingsTab('access');setShowA11yDock(false);setShowVoicePanel(false);setShowSettingsDrawer(true);}} aria-expanded={showSettingsDrawer && settingsTab==="access"} aria-controls="settings-drawer" aria-label={ui('Accessibility options',language)} title={ui('Accessibility options',language)} className="rounded-lg border"><Icons.Accessibility /></button>

                {/* Settings Drawer Button */}
                <button
                  onClick={() => {setSettingsTab('prefs');setShowSettingsDrawer(true);setShowA11yDock(false);setShowVoicePanel(false);}} aria-expanded={showSettingsDrawer} aria-controls="settings-drawer"
                  className="tap-ripple spring-press p-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"
                  aria-label={ui("Preferences", language)} title={ui("Preferences", language)}
                >
                  <Icons.Settings />
                </button>
                {/* Account menu is the last control, after Settings. */}
                {accountUser ? (
                  <details className="header-account account-dropdown" onToggle={event=>{if(event.currentTarget.open){setShowSettingsDrawer(false);setShowVoicePanel(false);setShowA11yDock(false);}}}>
                    <summary aria-label={accountUser.name || accountUser.email || 'Account'}>
                      {accountUser.photoURL ? <img src={accountUser.photoURL} alt="" referrerPolicy="no-referrer"/> : <span className="account-avatar" aria-hidden="true">{(accountUser.name||'?')[0]}</span>}
                      <span className="account-name">{accountUser.name || accountUser.email || 'Account'}</span>
                      <span className="account-caret" aria-hidden="true">⌄</span>
                    </summary>
                    <div className="account-menu">
                      <strong>{accountUser.name || accountUser.email || 'Account'}</strong>
                      {accountUser.email && <p>{accountUser.email}</p>}
                      <button type="button" data-open-profile onClick={event=>{event.currentTarget.closest('details').removeAttribute('open');setShowProfileSettings(true);setShowSettingsDrawer(false);setShowVoicePanel(false);setShowA11yDock(false);if(personalSession)refreshPersonal(language);}}>{ui('Profile settings',language)}</button>
                      <button type="button" onClick={handleSignOut}>{ui('Sign out',language)}</button>
                    </div>
                  </details>
                ) : (

                  <button
                    onClick={()=>window.location.assign('/login')}
                    className="tap-ripple spring-press flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 shadow-xs"
                    title={firebaseEnabled ? ui("Sign in with Google to sync your words and phrases", language) : ui("Firebase not configured yet", language)}
                  >
                    <svg className="w-4 h-4" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
                    <span className="hidden sm:inline">{ui("Sign in", language)}</span>
                  </button>

                )}

              </div>

            </div>
          </header>

          {/* ─── 2. MAIN COMMUNICATOR CANVAS ─────────────────────────── */}
          <main id="communication-board" className="aac-main flex-1 w-full mx-auto flex flex-col">



            {/* ─── 1-TAP QUICK EXPRESS & EMERGENCY PHRASES ─── */}
            <div className="quick-express" role="region" tabIndex={0} aria-label={ui("Quick Express",language)}>
              <span className="text-[10px] font-black uppercase tracking-wider text-rose-600 dark:text-rose-400 flex items-center gap-1 flex-shrink-0 bg-rose-50 dark:bg-rose-950/60 px-2.5 py-1.5 rounded-xl border border-rose-200 dark:border-rose-900 shadow-xs">
                <span>{ui("🚨 Quick Express", language)}</span>
              </span>

              {quickPhrases.map((phrase, idx) => (
                <button
                  key={idx}
                  onClick={() => {
                    generationEpoch.current++;setIsGenerating(false);
                    speak(phrase.text, language);
                    recordActivity('conversation', phrase.text, language);
                    setLastAudioB64(null); // so "Replay Voice" replays THIS phrase, not an older IndicF5 clip
                    setGeneratedResult({
                      text: phrase.text,
                      quick_express: true,
                      semantic_score: 1.0,
                      context_intent: QUICK_INTENT[phrase.emoji]?.act,
                      caregiver_context: { caregiver_explanation: sstr(QUICK_INTENT[phrase.emoji]?.key || 'intentUnknown',language) }
                    });
                    showToast(`Speaking: "${phrase.text}"`, 'info');
                  }}
                  className="tap-ripple spring-press flex-shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white dark:bg-slate-900 hover:bg-brand-50 hover:border-brand-300 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-100 font-bold text-xs border border-slate-200/90 dark:border-slate-800 shadow-xs transition-all cursor-pointer"
                  title={`Tap to speak: "${phrase.text}"`}
                >
                  <SymbolVisual item={visualItem(phrase.label,phrase.emoji)} style={visualStyle} photos={photoOverrides} />
                  <span>{phrase.label}</span>
                </button>
              ))}
            </div>

            <section className="composition-workspace" aria-label={ui("Sentence Canvas",language)} tabIndex={0}>
            {/* ─── COMMUNICATOR STAGE (Standard Hero Box) ─── */}
            <div className={`composer-panel bg-white dark:bg-slate-900 rounded-2xl border-2 transition-all p-4 sm:p-5 flex flex-col gap-3.5 shadow-sm ${
              isSpeaking ? 'border-emerald-500 ring-4 ring-emerald-500/15' : 'border-slate-200/90 dark:border-slate-800'
            }`}>

              {/* Header row inside stage: Live Status & Top 5 High-Peaked Words */}
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 pb-2 border-b border-slate-100 dark:border-slate-800/80">
                <div className="flex items-center gap-2">
                  <span className="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 dark:text-slate-500">{ui("Sentence Canvas", language)}</span>
                  {tokens.length > 0 && (
                    <span className="bg-brand-50 dark:bg-brand-950 text-brand-600 dark:text-brand-400 font-bold text-[10px] px-2 py-0.5 rounded-full">
                      {tokens.length} {tokens.length === 1 ? 'word' : 'words'}
                    </span>
                  )}
                  {isSpeaking && (
                    <span className="inline-flex items-center gap-1 text-emerald-600 dark:text-emerald-400 text-xs font-semibold pl-2">
                      <span className="sound-bar"></span>
                      <span className="sound-bar"></span>
                      <span className="sound-bar"></span>
                      <span className="sound-bar"></span>
                      <span className="text-[11px] ml-1">{ui("Speaking: \"", language)}{activeSpeakingWord}"</span>
                    </span>
                  )}
                </div>

                <details className="canvas-menu"
                  onPointerLeave={event => {
                    if (event.pointerType === 'touch') return;
                    const menu = event.currentTarget;
                    if (event.relatedTarget instanceof Node && menu.contains(event.relatedTarget)) return;
                    if (menu.open && menu.contains(document.activeElement)) menu.querySelector('summary').focus();
                    menu.open = false;
                  }}
                  onBlur={event => { if (!(event.relatedTarget instanceof Node) || !event.currentTarget.contains(event.relatedTarget)) event.currentTarget.open = false; }}
                  onKeyDown={event => {
                    if (event.key === 'Escape') {
                      event.currentTarget.open = false;
                      event.currentTarget.querySelector('summary').focus();
                      event.stopPropagation();
                    }
                  }}>
                  <summary aria-label={ui('Message actions', language)} title={ui('Message actions', language)}>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
                  </summary>
                  <div className="canvas-menu-actions" role="group" aria-label={ui('Message actions', language)}
                    onClick={event => {
                      if (!event.target.closest('button')) return;
                      const menu = event.currentTarget.closest('details');
                      menu.open = false;
                      menu.querySelector('summary').focus();
                    }}>
                    <button type="button" onClick={clearAll} disabled={!tokens.length && !inputText}>{ui('Clear', language)}</button>
                    <button type="button" onClick={removeLastToken} disabled={!tokens.length}><Icons.Backspace/>{ui('Delete Last', language)}</button>
                    <button type="button" onClick={handleUnjumble} disabled={tokens.length < 2}>{ui('Un-Jumble', language)}</button>
                  </div>
                </details>
              </div>

              {/* The Sentence Strip */}
              <div className="sentence-strip min-h-[85px] p-3 rounded-xl bg-slate-50/80 dark:bg-slate-950/60 border border-slate-200/80 dark:border-slate-800 flex flex-wrap items-center gap-2 focus-within:ring-2 focus-within:ring-brand-500/20 focus-within:border-brand-500 transition-all">
                {tokens.length === 0 && !inputText ? (
                  <span className="text-slate-400 dark:text-slate-500 text-sm font-medium italic pl-1">{ui("Select symbols below or type to compose message…", language)}</span>
                ) : null}

                {/* Active Sentence Tokens */}
                {tokens.map((token) => (
                  <div
                    key={token.id}
                    className={`spring-press inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl shadow-xs group ${token.isCustom ? "bg-pink-50 dark:bg-pink-950/30 border-2 border-pink-300 dark:border-pink-700" : "bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-brand-400"}`}
                  >
                    <button onClick={() => speak(token.label,language)} className="token-speak" title={ui('Speak word',language)}>
                      <SymbolVisual item={{...visualItem(token.label,token.emoji),k:token.visualId || token.cid || visualItem(token.label,token.emoji).k,image:token.image}} style={visualStyle} photos={photoOverrides}/>
                      <span>{token.label}</span>
                    </button>
                    <button
                      onClick={() => removeToken(token.id)}
                      className="text-slate-400 hover:text-rose-500 font-bold text-sm ml-0.5 p-0.5"

                      ✕
                    </button>
                  </div>

                {/* Direct Inline Typing (Physical Keyboard Friendly) */}
                <input
                  ref={inputRef}
                  type="text"
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  onKeyDown={handleInputKeyDown}
                  onPaste={handleWordPaste}
                  placeholder={
                    tokens.length > 0 
                      ? (language !== 'en' ? ui("+ शब्द जोड़ें / Add word...", language) : ui("+ Add word...", language))
                      : (language === 'gu' ? ui("શબ્દ લખો / Type custom word...", language) : language === 'mr' ? ui("शब्द टाइप करा / Type custom word...", language) : language === 'hi' ? ui("शब्द लिखें / Type custom word...", language) : ui("Type custom word...", language))

                    onClick={() => setShowPhoneticKeyboard(prev => !prev)}
                    className={`flex-shrink-0 px-2.5 py-1 text-xs font-bold rounded-lg border transition-all flex items-center gap-1.5 shadow-xs cursor-pointer ${
                      showPhoneticKeyboard
                        ? 'bg-brand-600 text-white border-brand-700 shadow-sm'
                        : 'bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:border-brand-400 hover:bg-slate-50 dark:hover:bg-slate-700'
                    }`}
                    title={showPhoneticKeyboard ? ui("Hide on-screen keyboard", language) : ui("Open on-screen keyboard for mouse/touch", language)}

                    <span className="text-[11px] font-bold">
                      {showPhoneticKeyboard
                        ? ui("Hide Keyboard", language)
                        : (language === 'gu' ? 'ગુજરાતી કીબોર્ડ' : language === 'mr' ? 'मराठी कीबोर्ड' : 'हिन्दी कीबोर्ड')}
                    </span>
                    <span className="text-[10px] opacity-75">{showPhoneticKeyboard ? '▲' : '▼'}</span>
                  </button>
                )}
              </div>

              {/* ─── NATIVE PHONETIC ON-SCREEN KEYBOARD (Indic: Hindi, Gujarati, Marathi) ─── */}
              {showPhoneticKeyboard && language !== 'en' && PHONETIC_KEYBOARD_DATA[language] && (
                <div className="phonetic-overlay rounded-2xl bg-white dark:bg-slate-900 border-2 border-brand-500/30 dark:border-brand-500/40 p-3 sm:p-4 shadow-xl transition-all animate-fadeIn">
                
                  {/* Keyboard Header */}
                  <div className="flex items-center justify-between pb-2.5 mb-2.5 border-b border-slate-100 dark:border-slate-800 gap-2 flex-wrap">
                    <div className="flex items-center gap-2">
                      <span className="text-base">⌨️</span>
                      <span className="font-extrabold text-xs sm:text-sm text-slate-900 dark:text-white">
                        {PHONETIC_KEYBOARD_DATA[language].langName}{ui("Phonetic Keyboard", language)}</span>
                      <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-brand-50 dark:bg-brand-950 text-brand-600 dark:text-brand-400 border border-brand-200 dark:border-brand-800">{ui("Touch & Type", language)}</span>
                    </div>

                    <div className="flex items-center gap-1.5">
                      {/* Section Tabs */}

                                  {char}

                            </div>

                      </div>

                    {/* NUMERALS */}

                            type="button"
                            onClick={() => handleInsertChar(num)}

                          </button>

                    <button

                      <span>{ui("Space", language)}</span>

                    <button

                      }}

                      <span>⏎</span>
                      <span>{language === 'gu' ? 'શબ્દ ઉમેરો' : language === 'mr' ? 'शब्द जोडा' : 'शब्द जोड़ें'}</span>
                    </button>
                  </div>

                </div>

                  <div className="flex items-center gap-2">
                    <span className="text-[11px] font-black uppercase tracking-wider text-slate-600 dark:text-slate-300 flex items-center gap-1.5">
                      <span>{ui("⚡ Next Word Predictions", language)}</span>

                    </span>

                          ∞-{pred.order}{ui("g", language)}</span>

                        <span className="text-[10px] font-bold text-slate-400 dark:text-slate-500">
                          {Math.round(pred.prob * 100)}%
                        </span>
                      )}
                    </button>
                  ))}
                </div>
              </div>

                    }}

                    className="primary-action tap-ripple spring-press flex items-center gap-2 px-5 py-2.5 rounded-xl text-white font-extrabold text-sm disabled:opacity-50"

                    <svg className="speech-toggle-icon" data-playback-icon={isSpeaking?'pause':'play'} width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">{isSpeaking?<><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/></>:<path d="m7 4 14 8-14 8Z" fill="currentColor"/>}</svg>
                    <span className="toolbar-label">{ui(isSpeaking?'Pause':isAudioPaused?'Play':'Speak',language)}</span>
                  </button>
                  <button

                      <>
                        <span className="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin"></span>
                        <span>{ui("Composing Sentence…", language)}</span>
                      </>

                      <>
                        <Icons.Sparkles />
                        <span className="toolbar-label">{ui("Make sentence", language)}</span>
                      </>
                    )}
                  </button>
                </div>

              </div>

            </section>
            </section>

                        setActiveCategory(cat.id);

                          setTimeout(() => document.getElementById('gridSearchInput')?.focus(), 50);

                          : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200/80 dark:border-slate-800 hover:border-slate-300'

                      <span className="category-label">{catLabel}</span>
                    </button>

                })}
              </div>

            </div>

                  </div>
                  <input
                    id="gridSearchInput"
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}

                    className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl pl-10 pr-4 py-2 text-sm font-semibold text-slate-800 dark:text-slate-100 focus:outline-none focus:border-brand-500"
                  />

                    <button
                      onClick={() => setSearchQuery('')}

                    <div className="custom-symbol-cell" key={item.k}>

                    </div>
                  ) : <button key={item.k} className="symbol-card comm-card flex flex-col items-center text-center border" data-symbol-id={item.k} onClick={() => addToken(item)}>{content}</button>;
                })}
              </div>

              {activeCategory === 'search' && displayedSymbols.length === 0 && searchQuery && (
                <div className="text-center py-12 text-slate-400 font-medium text-sm">{ui("No emojis found matching \"", language)}{searchQuery}".
                </div>
              )}


            </div>



            </section>
          </main>

                <div className="profile-panel-heading mywords-head"><div><h2>{MY_WORDS_META.label[language]} <span className="mywords-count">{customWords.length}</span></h2><p>{(MW_T[language]||MW_T.en).tap}</p></div><button type="button" className="mywords-close" aria-label={(MW_T[language]||MW_T.en).close} onClick={()=>setShowMyWords(false)}>✕</button></div>
                <div className="mywords-body"><section className="mywords-add" aria-label={(MW_T[language]||MW_T.en).add}><h3>{(MW_T[language]||MW_T.en).add}</h3><p className="mywords-hint">{(MW_T[language]||MW_T.en).hint}</p>
                <div className="custom-word-form flex items-center gap-2 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5">
                  {symbolStyle === 'ai' ? (
                    <button

                      disabled={isGeneratingSymbol || !newWordText.trim()}
                      className="tap-ripple spring-press w-12 h-12 flex-shrink-0 rounded-lg bg-white dark:bg-slate-900 border border-dashed border-pink-300 dark:border-pink-700 flex items-center justify-center text-lg disabled:opacity-50 overflow-hidden"
                      title={ui("Generate an AI symbol for this word", language)}

                </div>
                  </div>}
                  {settingsTab==='history' && <section role="tabpanel" id="settings-panel-history" aria-labelledby="settings-tab-history" className="settings-panel history-panel-inner">
                <header className="history-header"><div><p>{ui('Your communication space',language)}</p><h2 id="history-title">{ui('History',language)}</h2></div></header>
                <div className="history-content">
                  <div className="history-subheading"><h3>{ui('Recent conversations',language)}</h3><button type="button" onClick={()=>refreshPersonal(language)}>{ui('Refresh',language)}</button></div>
                  <button type="button" className="history-export" disabled={!recentConversations.length} onClick={exportHistory}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></svg>{sstr('exportCsv',language)}</button>
                  <p className="history-hint">{ui('Choose a message to speak it again.',language)}</p>
                  {storageError && <p role="status" className="history-error">{storageError}</p>}
                  {!recentConversations.length && <div className="history-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" aria-hidden="true"><path d="M4 4h16v12H9l-5 4V4Z"/><path d="M8 8h8M8 12h5"/></svg><h3>{ui('No conversations yet',language)}</h3><p>{ui('Your spoken messages will appear here.',language)}</p></div>}
                  <div className="history-groups">{historyGroups.map(group=><section className="history-day" key={group.date} aria-labelledby={'history-day-'+group.date}>
                    <h3 className="history-date" id={'history-day-'+group.date}><time dateTime={group.date}>{new Date(group.items[0].created_at*1000).toLocaleDateString(historyLocale,{dateStyle:'long'})}</time></h3>
                    <ul className="history-list">{group.items.map(item=><li key={item.id}>
                      <button type="button" className="history-message" onClick={()=>speak(item.text,item.language||language)}><span>{item.text}</span></button>{' '}
                      <time className="history-time" dateTime={new Date(item.created_at*1000).toISOString()}>{new Date(item.created_at*1000).toLocaleTimeString(historyLocale,{hour:'2-digit',minute:'2-digit'})}</time>
                      <button type="button" className="history-bookmark" aria-label={ui('Bookmark',language)+': '+item.text} onClick={()=>addBookmark(item.text)}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg></button>
                    </li>)}</ul>
                  </section>)}</div>
                </div>
                  </section>}
                </div>

                <button
                  onClick={() => setShowSettingsDrawer(false)}
                  className="tap-ripple spring-press w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs transition-all"
                >{ui("Save & Close", language)}</button>

              </div>
            </div>
          )}



          {/* ─── FOOTER ─────────────────────────────────────────────── */}
          <footer className="py-3 border-t border-slate-200/80 dark:border-slate-800 text-center text-[11px] text-slate-400"><span translate="no" lang="en">Indic AAC Studio</span></footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
