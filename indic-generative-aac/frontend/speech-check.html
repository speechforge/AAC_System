<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAC speech check</title><link rel="icon" type="image/svg+xml" href="/static/favicon.svg"><meta name="theme-color" content="#6044be"><meta name="description" content="Indic AAC Studio: communication support in English, Hindi, Gujarati and Marathi."><meta property="og:type" content="website"><meta property="og:site_name" content="Indic AAC Studio"><meta property="og:title" content="Indic AAC Studio"><meta property="og:description" content="Your words, clearly expressed. Communication support in English, Hindi, Gujarati and Marathi."><meta property="og:image" content="/static/thumbnail.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="/static/thumbnail.png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><link rel="manifest" href="/static/site.webmanifest"><!--studio-global--><link rel="stylesheet" href="/static/motion.css"><script src="/static/motion.js"></script><link rel="stylesheet" href="/static/ambient.css"><link rel="stylesheet" href="/static/studio-theme.css"><script src="/static/studio-core.js"></script><!--/studio-global-->
<style>body{font:18px system-ui;max-width:760px;margin:30px auto;padding:0 20px;background:var(--paper);color:var(--ink)}article{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:20px;margin:18px 0}audio{width:100%}button{padding:10px 16px;border:0;border-radius:8px;background:var(--violet);color:#fff;cursor:pointer}p{line-height:1.6}small{display:block;margin:8px 0;color:#53617b}a{color:#1746aa}</style>
<h1>AAC speech check</h1><p>Play each sample at normal speed. “Generate again” uses the live local speech engine. This page avoids word-tap interruptions and saved speed settings.</p><p><a href="/">Return to AAC</a></p>
<main id="samples"></main>
<script>
const samples=[['hi','हिन्दी','नमस्ते। मुझे पानी चाहिए। कृपया मेरी मदद करें।'],['gu','ગુજરાતી','નમસ્તે. મને પાણી જોઈએ છે. કૃપા કરીને મારી મદદ કરો.'],['mr','मराठी','नमस्कार. मला पाणी पाहिजे. कृपया मला मदत करा.'],['en','English','Hello. I need some water. Please help me.']];
for(const [language,label,text] of samples){
 const box=document.createElement('article'),title=document.createElement('h2'),sentence=document.createElement('p'),audio=document.createElement('audio'),button=document.createElement('button'),status=document.createElement('small');
 title.textContent=label;sentence.textContent=text;sentence.lang=language;audio.controls=true;audio.preload='none';audio.src='/static/audio/quality-'+language+'.wav?v=2';audio.playbackRate=1;audio.preservesPitch=true;button.textContent='Generate again';status.textContent=language==='en'?'Local F5-TTS English model':'Local IndicF5 model';
 button.onclick=async()=>{button.disabled=true;status.textContent='Generating…';try{const res=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,language,voice_id:language})});const data=await res.json();if(!res.ok)throw Error(data.detail||'Speech failed');audio.src='data:audio/wav;base64,'+data.audio_b64;audio.playbackRate=1;status.textContent=data.audio_kind+' · '+data.sample_rate+' Hz';}catch(e){status.textContent=e.message}finally{button.disabled=false}};
 box.append(title,sentence,audio,button,status);document.getElementById('samples').append(box);
}
</script></html>
